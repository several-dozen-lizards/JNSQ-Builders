<!doctype html><html lang="en"><meta charset="utf-8"><title>Graphics recovery check</title>
<style>body{background:#14231f;color:#eee;font:16px system-ui}#stage{position:relative;width:400px;height:260px}canvas{width:100%;height:100%}button{padding:10px;margin:8px}</style>
<h1>Graphics recovery check</h1><p>Isolated graphics test; does not load or change a world.</p>
<button id="lose">Simulate graphics loss</button><button id="restore">Restore graphics</button><p id="status">Starting</p>
<div id="stage"><canvas width="400" height="260"></canvas></div>
<script type="module">
import {renderRecovery,graphicsRecoveryPanel} from './render-recovery.mjs';
const canvas=document.querySelector('canvas'),status=document.querySelector('#status');
let creationError='';canvas.addEventListener('webglcontextcreationerror',e=>creationError=e.statusMessage||'');
const gl=canvas.getContext('webgl2'),extension=gl?.getExtension('WEBGL_lose_context');
const panel=graphicsRecoveryPanel(document.querySelector('#stage'));
if(!gl||!extension){status.textContent=gl?'Graphics-loss test extension unavailable':'WebGL2 unavailable · '+creationError;}else{
const recovery=renderRecovery(canvas,{onLost(){status.textContent='Loss caught';panel.show('Graphics interrupted; waiting for restoration.');},onRestored(){status.textContent='Restored and drawing';panel.hide();},onFailure(e){status.textContent=e.message;}});
document.querySelector('#lose').onclick=()=>extension.loseContext();document.querySelector('#restore').onclick=()=>extension.restoreContext();
status.textContent='Drawing';function frame(){requestAnimationFrame(frame);recovery.frame(()=>{gl.clearColor(.12,.5,.3,1);gl.clear(gl.COLOR_BUFFER_BIT);});}frame();
}
</script></html>
