<!doctype html><html><head><meta charset="utf-8"><style>body{background:#17272c;color:white;font:14px system-ui}#pairs{display:grid;grid-template-columns:480px 480px;gap:10px}canvas{width:480px;height:260px}</style><script src="/builders/standalone.js" defer></script></head><body><h1>Cloud shape · before / after</h1><div id="pairs"></div><pre id="result">RUNNING</pre><script type="module">
import * as THREE from './vendor/three.module.js';import {cloudVolumeGLSL as before} from './__before/cloud-volume.mjs';import {cloudVolumeGLSL as after} from './cloud-volume.mjs';import {cloudLightGLSL} from './sunlight.mjs';
const errors=[],old=console.error;console.error=(...a)=>{errors.push(a.join(' '));old(...a);};
try{
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(480,260);const s=new THREE.Scene(),c=new THREE.Camera(),g=new THREE.PlaneGeometry(2,2);const reports=[];
for(const [name,cover,storm,deck] of [['Scattered',.6,0,0],['Cloudy',.85,0,0],['Storm',1,1,0],['Lower cloud sea',.6,0,1]]){
for(const [label,code] of [['before',before],['after',after]]){
const material=new THREE.ShaderMaterial({uniforms:{cloudMarchSteps:{value:32},solarTime:{value:0},solarCover:{value:cover},solarColour:{value:new THREE.Color(1,.96,.89)},sunDirection:{value:new THREE.Vector3(-.6,.7,.4).normalize()},dayAmount:{value:1},cloudCover:{value:cover},stormAmount:{value:storm}},vertexShader:'varying vec2 screen;void main(){screen=uv;gl_Position=vec4(position,1.);}',fragmentShader:`varying vec2 screen;uniform vec3 sunDirection;uniform float dayAmount,cloudCover,stormAmount;${cloudLightGLSL}\n${code}\nvoid main(){vec3 ray=normalize(vec3((screen.x-.5)*2.4,${deck?'-(.08+screen.y*.9)':'.035+screen.y*1.1'},-1.));vec3 sky=mix(vec3(.65,.71,.81),vec3(.25,.45,.72),abs(ray.y));vec4 cloud=billowClouds(vec3(0.,3.,0.),ray,${deck?'-130.':'180.'},${deck?'100.':(label==='after'?'mix(125.,230.,stormAmount)':'mix(75.,210.,stormAmount)')},${deck?'1.':'0.'});gl_FragColor=vec4(sky*(1.-cloud.a)+cloud.rgb,1.);#include <tonemapping_fragment>\n#include <colorspace_fragment>}`.replace(';#include',';\n#include')});
const mesh=new THREE.Mesh(g,material);s.add(mesh);r.render(s,c);const canvas=document.createElement('canvas');canvas.width=480;canvas.height=260;canvas.getContext('2d').drawImage(r.domElement,0,0);const fig=document.createElement('div');fig.append(name+' · '+label,canvas);document.querySelector('#pairs').append(fig);reports.push({name,label,calls:r.info.render.calls,triangles:r.info.render.triangles});s.remove(mesh);material.dispose();
}}
document.querySelector('#result').textContent=JSON.stringify({status:errors.length?'FAIL':'PASS',errors,reports},null,2);r.dispose();
}catch(e){document.querySelector('#result').textContent='FAIL '+e.stack;}
</script></body></html>
